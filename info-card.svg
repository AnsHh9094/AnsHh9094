<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 260" width="490" height="260">
  <defs>
    <style>
      .card-bg { fill: #0d1117; }
      .header-bar { fill: #161b22; }
      .title-text { font-family: "Courier New", Courier, monospace; font-size: 12px; fill: #8b949e; font-weight: bold; }
      .key-text { font-family: "Courier New", Courier, monospace; font-size: 12px; fill: #7ee787; font-weight: bold; }
      .val-text { font-family: "Courier New", Courier, monospace; font-size: 12px; fill: #c9d1d9; }
      .prompt-char { font-family: "Courier New", Courier, monospace; font-size: 13px; fill: #79c0ff; font-weight: bold; }
    </style>
  </defs>
  <rect width="490" height="260" rx="10" ry="10" class="card-bg"/>
  <rect width="490" height="260" rx="10" ry="10" stroke="#30363d" stroke-width="1" fill="none"/>
  <rect width="490" height="32" rx="10" ry="10" class="header-bar"/>
  <rect x="0" y="22" width="490" height="10" class="header-bar"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="16" r="5" fill="#27c93f"/>
  <text x="245" y="20" text-anchor="middle" class="title-text">neofetch --user AnsHh9094</text>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <text x="22" y="62" class="prompt-char">&#x276F;</text>
    <text x="40" y="62" class="key-text">OS     :</text>
    <text x="115" y="62" class="val-text">Arch Linux / WSL</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.35s" fill="freeze"/>
    <text x="22" y="94" class="prompt-char">&#x276F;</text>
    <text x="40" y="94" class="key-text">Host   :</text>
    <text x="115" y="94" class="val-text">Anand Ansh (@AnsHh9094)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <text x="22" y="126" class="prompt-char">&#x276F;</text>
    <text x="40" y="126" class="key-text">Role   :</text>
    <text x="115" y="126" class="val-text">Full-Stack & AI Systems Engineer</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.65s" fill="freeze"/>
    <text x="22" y="158" class="prompt-char">&#x276F;</text>
    <text x="40" y="158" class="key-text">Stack  :</text>
    <text x="115" y="158" class="val-text">Python · TypeScript · React · Node.js · Docker</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <text x="22" y="190" class="prompt-char">&#x276F;</text>
    <text x="40" y="190" class="key-text">Focus  :</text>
    <text x="115" y="190" class="val-text">Building Autonomous Web Agents & Clean Interfaces</text>
  </g>
  <line x1="20" y1="230" x2="470" y2="230" stroke="#30363d" stroke-width="0.5"/>
  <text x="22" y="248" class="prompt-char">&#x276F;</text>
  <rect x="38" y="238" width="8" height="13" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>