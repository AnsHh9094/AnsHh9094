<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 240" width="490" height="240">
  <style>
    .card-bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1; }
    .header-bar { fill: #161b22; rx: 10px; ry: 10px; }
    .title-text { font-family: "Fira Code", monospace; font-size: 12px; fill: #8b949e; font-weight: bold; }
    .prompt-text { font-family: "Fira Code", monospace; font-size: 13px; fill: #79c0ff; font-weight: bold; }
    .key-text { font-family: "Fira Code", monospace; font-size: 12px; fill: #7ee787; font-weight: bold; }
    .val-text { font-family: "Fira Code", monospace; font-size: 12px; fill: #c9d1d9; }
    .sub-text { font-family: "Fira Code", monospace; font-size: 11px; fill: #8b949e; }
    
    /* Row fade-in slide keyframes */
    @keyframes rowFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animated-row { opacity: 0; animation: rowFadeIn 0.4s ease-out forwards; }
    .row-1 { animation-delay: 0.1s; }
    .row-2 { animation-delay: 0.25s; }
    .row-3 { animation-delay: 0.4s; }
    .row-4 { animation-delay: 0.55s; }
    .row-5 { animation-delay: 0.7s; }
  </style>
  <rect width="490" height="240" class="card-bg"/>
  <rect width="490" height="32" class="header-bar"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="16" r="5" fill="#27c93f"/>
  <text x="245" y="20" text-anchor="middle" class="title-text">neofetch --user AnshH9094</text>
  <g class="animated-row row-1">
    <text x="22" y="62" class="prompt-text">❯</text>
    <text x="40" y="62" class="key-text">OS     :</text>
    <text x="115" y="62" class="val-text">Arch Linux / Windows Subsystem for Linux</text>
  </g>
  <g class="animated-row row-2">
    <text x="22" y="94" class="prompt-text">❯</text>
    <text x="40" y="94" class="key-text">Host   :</text>
    <text x="115" y="94" class="val-text">Anand Ansh (@AnshH9094)</text>
  </g>
  <g class="animated-row row-3">
    <text x="22" y="126" class="prompt-text">❯</text>
    <text x="40" y="126" class="key-text">Role   :</text>
    <text x="115" y="126" class="val-text">Full-Stack & AI Systems Engineer</text>
  </g>
  <g class="animated-row row-4">
    <text x="22" y="158" class="prompt-text">❯</text>
    <text x="40" y="158" class="key-text">Stack  :</text>
    <text x="115" y="158" class="val-text">Python • TypeScript • React • Node.js • Docker</text>
  </g>
  <g class="animated-row row-5">
    <text x="22" y="190" class="prompt-text">❯</text>
    <text x="40" y="190" class="key-text">Focus  :</text>
    <text x="115" y="190" class="val-text">Building Autonomous Web Agents & Clean Interfaces</text>
  </g>
</svg>